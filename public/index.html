<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coolx Pay — Главная</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #05070a;
      --card-bg: rgba(15, 20, 31, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(121, 40, 202, 0.5);
      --accent-pink: #FF0080;
      --accent-cyan: #00DFD8;
      --star-color: #FFB800;
      --grad-coolx: linear-gradient(135deg, #7928CA 0%, #FF0080 100%);
      --text-white: #FFFFFF;
      --text-gray: #94A3B8;
      --font-brand: 'Unbounded', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 90px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(121, 40, 202, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .header {
      background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border); padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

    .brand-logo { font-family: var(--font-brand); font-size: 1.1rem; font-weight: 900; background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .main-container { max-width: 650px; margin: 0 auto; padding: 20px 16px; }

    /* Баннер гаранта */
    .hero-banner {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.3) 0%, rgba(255, 0, 128, 0.2) 100%);
      border: 1px solid var(--card-border-glow); border-radius: 20px; padding: 20px;
      margin-bottom: 24px; backdrop-filter: blur(10px);
    }

    .hero-title { font-family: var(--font-brand); font-size: 1.1rem; margin-bottom: 8px; }
    .hero-desc { font-size: 0.85rem; color: var(--text-gray); line-height: 1.4; margin-bottom: 14px; }
    
    .create-item-btn {
      background: var(--grad-coolx); border: none; padding: 12px 20px; border-radius: 12px;
      color: #fff; font-family: var(--font-brand); font-size: 0.8rem; cursor: pointer;
    }

    /* Категории */
    .section-title { font-family: var(--font-brand); font-size: 0.9rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .categories-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
    .cat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; }
    .cat-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .cat-name { font-size: 0.7rem; font-weight: 600; color: var(--text-gray); }

    /* Свежие лоты */
    .goods-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .coolx-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .card-category { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--accent-pink); margin-bottom: 6px; }
    .card-title { font-weight: 600; font-size: 0.88rem; line-height: 1.3; margin-bottom: 10px; }
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 8px; }
    .card-price { font-family: var(--font-brand); font-size: 0.82rem; color: var(--star-color); }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; padding: 12px 0 16px 0; z-index: 1000;
    }

    .nav-link { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
    .nav-link.active { color: var(--text-white); }
    .nav-link.active .nav-icon { background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo">COOLX PAY</div>
    <div style="font-family: var(--font-brand); font-size: 0.8rem; color: var(--accent-cyan);">GARANT</div>
  </header>

  <main class="main-container">
    <div class="hero-banner">
      <div class="hero-title">Маркетплейс & Гарант</div>
      <div class="hero-desc">Безопасные сделки цифровых товаров и услуг за Telegram Stars. Автоматический удержание средств на время сделки.</div>
      <button class="create-item-btn" onclick="location.href='create-item.html'">+ Продать лот</button>
    </div>

    <div class="section-title">Категории</div>
    <div class="categories-grid">
      <div class="cat-card" onclick="location.href='catalog.html?cat=roblox'"><div class="cat-icon">🎮</div><div class="cat-name">Roblox</div></div>
      <div class="cat-card" onclick="location.href='catalog.html?cat=telegram'"><div class="cat-icon">✈️</div><div class="cat-name">Telegram</div></div>
      <div class="cat-card" onclick="location.href='catalog.html?cat=scripts'"><div class="cat-icon">💻</div><div class="cat-name">Скрипты</div></div>
      <div class="cat-card" onclick="location.href='catalog.html?cat=other'"><div class="cat-icon">⚡</div><div class="cat-name">Другое</div></div>
    </div>

    <div class="section-title">
      <span>Новые лоты</span>
      <a href="catalog.html" style="font-size: 0.75rem; color: var(--accent-cyan); text-decoration: none;">Все →</a>
    </div>

    <div class="goods-grid" id="recent-items">
      <div style="grid-column: span 2; text-align: center; color: var(--text-gray); padding: 20px 0;">Загрузка лотов...</div>
    </div>
  </main>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link active"><span class="nav-icon">⚡</span><span>Главная</span></a>
    <a href="catalog.html" class="nav-link"><span class="nav-icon">🛍️</span><span>Лоты</span></a>
    <a href="chat.html" class="nav-link"><span class="nav-icon">💬</span><span>Чаты</span></a>
    <a href="finances.html" class="nav-link"><span class="nav-icon">💎</span><span>Финансы</span></a>
    <a href="profile.html" class="nav-link"><span class="nav-icon">👤</span><span>Профиль</span></a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadRecentItems() {
      const { data: items } = await supabase
        .from('items')
        .select('*')
        .eq('status', 'active')
        .order('created_at', { ascending: false })
        .limit(6);

      const container = document.getElementById('recent-items');
      if (!items || items.length === 0) {
        container.innerHTML = `<div style="grid-column: span 2; text-align: center; color: var(--text-gray);">Нет доступных лотов</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="coolx-card" onclick="location.href='item.html?id=${item.id}'">
          <div>
            <div class="card-category">${item.category}</div>
            <div class="card-title">${item.title}</div>
          </div>
          <div class="card-bottom">
            <div class="card-price">★ ${item.price_stars}</div>
          </div>
        </div>
      `).join('');
    }

    loadRecentItems();
  </script>
</body>
</html>
