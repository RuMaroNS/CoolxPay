<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coolx Pay — Профиль</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #05070a;
      --card-bg: rgba(15, 20, 31, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(121, 40, 202, 0.4);
      --accent-pink: #FF0080;
      --accent-cyan: #00DFD8;
      --star-color: #FFB800;
      --status-online: #10B981;
      --status-banned: #EF4444;
      --status-offline: #6B7280;
      --grad-coolx: linear-gradient(135deg, #7928CA 0%, #FF0080 100%);
      --text-white: #FFFFFF;
      --text-gray: #94A3B8;
      --font-brand: 'Unbounded', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 90px;
      background-image: radial-gradient(circle at 50% 0%, rgba(121, 40, 202, 0.15) 0%, transparent 50%);
    }

    .header {
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo { font-family: var(--font-brand); font-size: 1.1rem; font-weight: 900; background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }

    .main-container { max-width: 650px; margin: 0 auto; padding: 20px 16px; }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 16px;
    }

    .avatar-container { position: relative; width: 84px; height: 84px; margin-bottom: 12px; }

    .avatar-wrapper {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--grad-coolx);
      padding: 3px;
    }

    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111827; }

    .status-badge {
      position: absolute; bottom: 2px; right: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 3px solid var(--bg-main);
    }

    .status-online { background-color: var(--status-online); }
    .status-offline { background-color: var(--status-offline); }
    .status-banned { background-color: var(--status-banned); }

    .user-name { font-family: var(--font-brand); font-size: 1.15rem; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .user-status-text { font-size: 0.75rem; color: var(--text-gray); margin-bottom: 14px; font-weight: 500; }

    .stats-row {
      display: flex; justify-content: space-around;
      width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 14px; margin-top: 6px;
    }

    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-val { font-family: var(--font-brand); font-size: 0.95rem; color: var(--accent-cyan); }
    .stat-label { font-size: 0.68rem; color: var(--text-gray); text-transform: uppercase; }

    .balance-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px; padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }

    .balance-amount { font-family: var(--font-brand); font-size: 1.2rem; color: var(--star-color); }

    .action-btn {
      background: var(--grad-coolx); border: none; border-radius: 10px;
      padding: 10px 16px; color: #fff; font-family: var(--font-brand);
      font-size: 0.75rem; cursor: pointer;
    }

    .tabs-container {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 10px; margin-bottom: 16px;
      scrollbar-width: none;
    }

    .tabs-container::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-gray); padding: 10px 16px; border-radius: 12px;
      font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--grad-coolx); color: #fff; border-color: transparent;
    }

    .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .reviews-list { display: flex; flex-direction: column; gap: 10px; }

    .item-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 14px; cursor: pointer;
    }

    .item-cat { font-size: 0.65rem; color: var(--accent-pink); font-weight: 700; text-transform: uppercase; }
    .item-title { font-size: 0.85rem; font-weight: 600; margin: 4px 0 8px 0; }
    .item-price { font-family: var(--font-brand); font-size: 0.8rem; color: var(--star-color); }

    .review-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 14px;
    }

    .review-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .review-author { font-size: 0.82rem; font-weight: 700; color: var(--accent-cyan); }
    .review-stars { font-size: 0.75rem; color: var(--star-color); font-family: var(--font-brand); }
    .review-text { font-size: 0.85rem; color: var(--text-gray); line-height: 1.4; }

    .empty-state { grid-column: span 2; text-align: center; color: var(--text-gray); padding: 30px 0; font-size: 0.85rem; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; padding: 12px 0 16px 0; z-index: 1000;
    }

    .nav-link { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
    .nav-link.active { color: var(--text-white); }
    .nav-link.active .nav-icon { background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo" onclick="location.href='index.html'">COOLX PAY</div>
    <div id="header-profile-tag" style="font-family: var(--font-brand); font-size: 0.8rem; color: var(--accent-cyan);">ПРОФИЛЬ</div>
  </header>

  <main class="main-container">
    <div class="profile-card" id="profile-card">
      <div class="empty-state">Загрузка профиля...</div>
    </div>

    <div class="balance-box" id="my-balance-box" style="display: none;">
      <div>
        <div style="font-size: 0.75rem; color: var(--text-gray); margin-bottom: 2px;">Ваш баланс Stars</div>
        <div class="balance-amount" id="user-balance">★ 0</div>
      </div>
      <button class="action-btn" onclick="location.href='finances.html'">Вывести</button>
    </div>

    <div class="tabs-container" id="tabs-container"></div>
    <div id="tab-content" class="content-grid"></div>
  </main>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link"><span class="nav-icon">⚡</span><span>Главная</span></a>
    <a href="catalog.html" class="nav-link"><span class="nav-icon">🛍️</span><span>Лоты</span></a>
    <a href="chat.html" class="nav-link"><span class="nav-icon">💬</span><span>Чаты</span></a>
    <a href="finances.html" class="nav-link"><span class="nav-icon">💎</span><span>Финансы</span></a>
    <a href="profile.html" class="nav-link active"><span class="nav-icon">👤</span><span>Профиль</span></a>
  </nav>

  <script>
    let supabaseClient = null;
    let isOwner = false;
    let targetUserId = null;

    async function initApp() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
          auth: { persistSession: false }
        });

        initProfilePage();
      } catch (err) {
        console.error("Ошибка инициализации Supabase:", err);
      }
    }

    async function initProfilePage() {
        if (!supabaseClient) return;

        // Берем ID текущего авторизованного пользователя из localStorage
        const currentAuthUser = localStorage.getItem('coolx_user_id');

        const urlParams = new URLSearchParams(window.location.search);
        targetUserId = urlParams.get('id');

        // Если в URL нет параметра id, значит, пользователь открыл свой собственный профиль
        if (!targetUserId) {
            if (!currentAuthUser) {
                // Если в localStorage вообще ничего нет — отправляем на страницу авторизации
                window.location.href = 'auth.html';
                return;
            }
            targetUserId = currentAuthUser;
        }

        // Определяем, является ли этот профиль вашим собственным
        isOwner = (targetUserId === currentAuthUser);

        await loadUserProfileData();
        renderTabs();
        switchTab('active_items');
    }

    async function loadUserProfileData() {
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', targetUserId)
        .single();

      if (error || !profile) {
        document.getElementById('profile-card').innerHTML = `<div class="empty-state">Пользователь #${targetUserId} не найден</div>`;
        return;
      }

      let statusClass = 'status-offline';
      let statusText = 'Не в сети';

      if (profile.is_banned) {
        statusClass = 'status-banned';
        statusText = 'Заблокирован';
      } else if (profile.is_online) {
        statusClass = 'status-online';
        statusText = 'В сети';
      } else if (profile.last_seen) {
        statusText = `Был(а) недавно (${new Date(profile.last_seen).toLocaleDateString()})`;
      }

      document.getElementById('profile-card').innerHTML = `
        <div class="avatar-container">
          <div class="avatar-wrapper">
            <img class="avatar-img" src="${profile.avatar_url || 'https://via.placeholder.com/150'}" alt="Avatar">
          </div>
          <div class="status-badge ${statusClass}"></div>
        </div>
        <div class="user-name">${profile.username || 'Пользователь'}</div>
        <div class="user-status-text">${statusText}</div>

        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-val">${profile.rating || '5.0'} ★</span>
            <span class="stat-label">Рейтинг</span>
          </div>
          <div class="stat-item">
            <span class="stat-val">${profile.completed_deals || 0}</span>
            <span class="stat-label">Сделок</span>
          </div>
        </div>
      `;

      if (isOwner) {
        document.getElementById('my-balance-box').style.display = 'flex';
        document.getElementById('user-balance').innerText = `★ ${profile.balance_stars || 0}`;
        document.getElementById('header-profile-tag').innerText = 'МОЙ ПРОФИЛЬ';
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');

      if (isOwner) {
        container.innerHTML = `
          <button class="tab-btn active" onclick="switchTab('active_items', this)">Активные лоты</button>
          <button class="tab-btn" onclick="switchTab('closed_items', this)">Завершенные лоты</button>
          <button class="tab-btn" onclick="switchTab('received_reviews', this)">Полученные отзывы</button>
          <button class="tab-btn" onclick="switchTab('left_reviews', this)">Оставленные отзывы</button>
        `;
      } else {
        container.innerHTML = `
          <button class="tab-btn active" onclick="switchTab('active_items', this)">Активные лоты</button>
          <button class="tab-btn" onclick="switchTab('received_reviews', this)">Отзывы профиля</button>
        `;
      }
    }

    async function switchTab(tabType, element) {
      if (element) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        element.classList.add('active');
      }

      const contentBox = document.getElementById('tab-content');
      contentBox.className = (tabType.includes('reviews')) ? 'reviews-list' : 'content-grid';
      contentBox.innerHTML = `<div class="empty-state">Загрузка данных...</div>`;

      if (tabType === 'active_items') {
        const { data } = await supabaseClient.from('items').select('*').eq('seller_id', targetUserId).eq('status', 'active');
        renderItemsList(data);
      } 
      else if (tabType === 'closed_items') {
        const { data } = await supabaseClient.from('items').select('*').eq('seller_id', targetUserId).eq('status', 'sold');
        renderItemsList(data);
      } 
      else if (tabType === 'received_reviews') {
        const { data } = await supabaseClient.from('reviews').select('*, profiles!reviews_from_user_id_fkey(username)').eq('to_user_id', targetUserId);
        renderReviewsList(data);
      } 
      else if (tabType === 'left_reviews') {
        const { data } = await supabaseClient.from('reviews').select('*, profiles!reviews_to_user_id_fkey(username)').eq('from_user_id', targetUserId);
        renderReviewsList(data);
      }
    }

    function renderItemsList(items) {
      const container = document.getElementById('tab-content');
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="empty-state">Лоты отсутствуют</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="item-card" onclick="location.href='item.html?id=${item.id}'">
          <div class="item-cat">${item.category}</div>
          <div class="item-title">${item.title}</div>
          <div class="item-price">★ ${item.price_stars}</div>
        </div>
      `).join('');
    }

    function renderReviewsList(reviews) {
      const container = document.getElementById('tab-content');
      if (!reviews || reviews.length === 0) {
        container.innerHTML = `<div class="empty-state">Отзывов пока нет</div>`;
        return;
      }

      container.innerHTML = reviews.map(r => `
        <div class="review-card">
          <div class="review-head">
            <span class="review-author">${r.profiles?.username || 'Пользователь'}</span>
            <span class="review-stars">${'★'.repeat(r.rating)}</span>
          </div>
          <div class="review-text">${r.text}</div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
  
  <script src="https://telegram.org/js/telegram-web-app.js" onerror="window.Telegram = { WebApp: { ready: ()=>{}, expand: ()=>{} } };"></script>
  <script src="/api/apiclient.js"></script>
  <script src="/api/tgapp.js"></script>
  <script src="/api/profilelogic.js"></script>
  <script src="/api/cataloglogic.js"></script>
</body>
</html>
