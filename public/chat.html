<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coolx Pay — Чаты</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #05070a;
      --card-bg: rgba(15, 20, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-pink: #FF0080;
      --accent-cyan: #00DFD8;
      --star-color: #FFB800;
      --grad-coolx: linear-gradient(135deg, #7928CA 0%, #FF0080 100%);
      --text-white: #FFFFFF;
      --text-gray: #94A3B8;
      --font-brand: 'Unbounded', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: var(--bg-main); color: var(--text-white); min-height: 100vh; padding-bottom: 80px; }

    .header { background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--card-border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo { font-family: var(--font-brand); font-size: 1.1rem; font-weight: 900; background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }

    .main-container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }

    /* Окно мессенджера (3 колонки как на скрине) */
    .messenger-layout {
      display: grid;
      grid-template-columns: 280px 1fr 240px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      height: 75vh;
      backdrop-filter: blur(12px);
    }

    @media (max-width: 850px) {
      .messenger-layout { grid-template-columns: 1fr; height: 80vh; }
      .chat-sidebar, .chat-info-panel { display: none; } /* Для мобилок можно сделать переключение, тут показываем чат */
    }

    /* Левая колонка: Список чатов */
    .chat-sidebar { border-right: 1px solid var(--card-border); overflow-y: auto; background: rgba(10, 14, 22, 0.5); }
    .sidebar-header { padding: 16px; font-family: var(--font-brand); font-size: 0.85rem; border-bottom: 1px solid var(--card-border); }
    
    .chat-item {
      padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer; display: flex; gap: 12px; align-items: center; transition: background 0.2s;
    }
    .chat-item:hover, .chat-item.active { background: rgba(121, 40, 202, 0.15); }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: var(--accent-cyan); flex-shrink: 0; }
    .chat-meta { overflow: hidden; }
    .chat-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-lastmsg { font-size: 0.75rem; color: var(--text-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Центральная колонка: Переписка */
    .chat-main { display: flex; flex-direction: column; background: rgba(5, 7, 10, 0.3); }
    .chat-header-info { padding: 12px 16px; border-bottom: 1px solid var(--card-border); font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; word-break: break-word; }
    .message-bubble.incoming { background: rgba(255, 255, 255, 0.05); align-self: flex-start; border-bottom-left-radius: 4px; }
    .message-bubble.outgoing { background: var(--grad-coolx); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }

    .chat-input-box { padding: 12px 16px; border-top: 1px solid var(--card-border); display: flex; gap: 10px; align-items: center; background: rgba(10, 14, 22, 0.6); }
    .chat-input { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 14px; color: #fff; font-size: 0.85rem; outline: none; }
    .send-btn { background: var(--grad-coolx); border: none; width: 40px; height: 40px; border-radius: 12px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }

    /* Правая колонка: Инфо */
    .chat-info-panel { border-left: 1px solid var(--card-border); padding: 20px 16px; font-size: 0.8rem; color: var(--text-gray); background: rgba(10, 14, 22, 0.5); }
    .info-title { font-family: var(--font-brand); font-size: 0.8rem; color: #fff; margin-bottom: 10px; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; padding: 12px 0 16px 0; z-index: 1000;
    }
    .nav-link { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
    .nav-link.active { color: var(--text-white); }
    .nav-link.active .nav-icon { background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo" onclick="location.href='index.html'">COOLX PAY</div>
    <div style="font-family: var(--font-brand); font-size: 0.8rem; color: var(--accent-cyan);">СООБЩЕНИЯ</div>
  </header>

  <main class="main-container">
    <div class="messenger-layout">
      <!-- Левая колонка: Диалоги -->
      <div class="chat-sidebar" id="chats-list">
        <div class="sidebar-header">Диалоги</div>
        <div style="padding: 20px; text-align: center; color: var(--text-gray); font-size: 0.8rem;">Загрузка чатов...</div>
      </div>

      <!-- Центральная колонка: Чат -->
      <div class="chat-main">
        <div class="chat-header-info" id="active-chat-title">Выберите диалог</div>
        <div class="messages-container" id="messages-box">
          <div style="margin: auto; text-align: center; color: var(--text-gray); font-size: 0.85rem;">Выберите чат слева для начала общения</div>
        </div>
        <div class="chat-input-box">
          <input type="text" id="message-input" class="chat-input" placeholder="Написать сообщение...">
          <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
      </div>

      <!-- Правая колонка: Информация -->
      <div class="chat-info-panel">
        <div class="info-title">Информация</div>
        <p>Здесь отображаются данные о пользователе или сделке.</p>
      </div>
    </div>
  </main>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link"><span class="nav-icon">⚡</span><span>Главная</span></a>
    <a href="catalog.html" class="nav-link"><span class="nav-icon">🛍️</span><span>Лоты</span></a>
    <a href="chat.html" class="nav-link active"><span class="nav-icon">💬</span><span>Чаты</span></a>
    <a href="finances.html" class="nav-link"><span class="nav-icon">💎</span><span>Финансы</span></a>
    <a href="profile.html" class="nav-link"><span class="nav-icon">👤</span><span>Профиль</span></a>
  </nav>

  <script>
    let supabaseClient = null;
    let currentUserId = null;
    let activeChatUser = null;

    async function initApp() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
          auth: { persistSession: false }
        });

        currentUserId = localStorage.getItem('coolx_user_id');
        if (!currentUserId) {
          window.location.href = 'auth.html';
          return;
        }

        loadChats();
      } catch (err) {
        console.error("Ошибка инициализации:", err);
      }
    }

    async function loadChats() {
      // Пример загрузки списка пользователей, с кем были чаты или транзакции
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('id, username')
        .neq('id', currentUserId)
        .limit(10);

      const listContainer = document.getElementById('chats-list');
      if (!data || data.length === 0) {
        listContainer.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-gray); font-size: 0.8rem;">Нет активных чатов</div>`;
        return;
      }

      listContainer.innerHTML = `<div class="sidebar-header">Диалоги</div>` + data.map(user => `
        <div class="chat-item" onclick="openChat('${user.id}', '${user.username || 'Пользователь'}')">
          <div class="chat-avatar">${(user.username || 'U')[0].toUpperCase()}</div>
          <div class="chat-meta">
            <div class="chat-name">${user.username || 'Пользователь'}</div>
            <div class="chat-lastmsg">Нажмите, чтобы открыть чат</div>
          </div>
        </div>
      `).join('');
    }

    function openChat(userId, username) {
      activeChatUser = userId;
      document.getElementById('active-chat-title').innerText = username;
      loadMessages();
    }

    async function loadMessages() {
      if (!activeChatUser) return;
      // Логика загрузки сообщений из таблицы messages (если она у вас есть)
      const box = document.getElementById('messages-box');
      box.innerHTML = `<div style="text-align: center; color: var(--text-gray); font-size: 0.8rem; margin-top: 20px;">Загрузка сообщений...</div>`;
      
      // Имитация / запрос к таблице сообщений
      // Допустим, таблица messages хранит sender_id, receiver_id, text
      const { data } = await supabaseClient
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${activeChatUser}),and(sender_id.eq.${activeChatUser},receiver_id.eq.${currentUserId})`)
        .order('created_at', { ascending: true });

      if (!data || data.length === 0) {
        box.innerHTML = `<div style="text-align: center; color: var(--text-gray); font-size: 0.8rem; margin-top: 20px;">История сообщений пуста. Напишите первое сообщение!</div>`;
        return;
      }

      box.innerHTML = data.map(m => `
        <div class="message-bubble ${m.sender_id === currentUserId ? 'outgoing' : 'incoming'}">
          ${m.text}
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      const { error } = await supabaseClient.from('messages').insert({
        sender_id: currentUserId,
        receiver_id: activeChatUser,
        text: text
      });

      if (!error) {
        input.value = '';
        loadMessages();
      } else {
        alert('Не удалось отправить сообщение');
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
