<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coolx Pay — Детали лота</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #05070a;
      --card-bg: rgba(15, 20, 31, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(121, 40, 202, 0.5);
      --accent-pink: #FF0080;
      --accent-cyan: #00DFD8;
      --star-color: #FFB800;
      --grad-coolx: linear-gradient(135deg, #7928CA 0%, #FF0080 100%);
      --text-white: #FFFFFF;
      --text-gray: #94A3B8;
      --font-brand: 'Unbounded', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: var(--bg-main); color: var(--text-white); min-height: 100vh; padding-bottom: 90px; }

    .header { background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--card-border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo { font-family: var(--font-brand); font-size: 1.1rem; font-weight: 900; background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }

    .main-container { max-width: 650px; margin: 20px auto; padding: 0 16px; }

    .item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; backdrop-filter: blur(12px); margin-bottom: 20px; }
    .item-category { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--accent-pink); margin-bottom: 8px; }
    .item-title { font-family: var(--font-brand); font-size: 1.2rem; margin-bottom: 16px; line-height: 1.4; }
    .item-price-box { font-family: var(--font-brand); font-size: 1.5rem; color: var(--star-color); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    
    .item-desc-title { font-size: 0.8rem; font-weight: 700; color: var(--text-gray); text-transform: uppercase; margin-bottom: 8px; }
    .item-desc { font-size: 0.9rem; color: #E2E8F0; line-height: 1.5; margin-bottom: 24px; white-space: pre-wrap; word-break: break-word; }

    .seller-box { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 16px; margin-bottom: 24px; }
    .seller-info { display: flex; gap: 12px; align-items: center; }
    .seller-avatar { width: 44px; height: 44px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent-cyan); }
    .seller-name { font-weight: 600; font-size: 0.9rem; }
    .seller-status { font-size: 0.75rem; color: var(--text-gray); }

    .buy-btn { width: 100%; background: var(--grad-coolx); border: none; padding: 16px; border-radius: 14px; color: #fff; font-family: var(--font-brand); font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s; }
    .buy-btn:hover { opacity: 0.9; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; padding: 12px 0 16px 0; z-index: 1000;
    }
    .nav-link { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
    .nav-link.active { color: var(--text-white); }
    .nav-link.active .nav-icon { background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo" onclick="location.href='index.html'">COOLX PAY</div>
    <div onclick="history.back()" style="color: var(--text-gray); cursor: pointer; font-size: 0.85rem;">Назад</div>
  </header>

  <main class="main-container" id="item-container">
    <div style="text-align: center; color: var(--text-gray); padding: 40px 0;">Загрузка информации о лоте...</div>
  </main>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link"><span class="nav-icon">⚡</span><span>Главная</span></a>
    <a href="catalog.html" class="nav-link active"><span class="nav-icon">🛍️</span><span>Лоты</span></a>
    <a href="chat.html" class="nav-link"><span class="nav-icon">💬</span><span>Чаты</span></a>
    <a href="finances.html" class="nav-link"><span class="nav-icon">💎</span><span>Финансы</span></a>
    <a href="profile.html" class="nav-link"><span class="nav-icon">👤</span><span>Профиль</span></a>
  </nav>

  <script src="/api/apiclient.js"></script>
<script>
  let supabaseClient = null;
  let currentUserId = null;
  let currentItem = null;

  async function initApp() {
    try {
      const res = await fetch('/api/config');
      const config = await res.json();
      supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
        auth: { persistSession: false }
      });

      currentUserId = localStorage.getItem('coolx_user_id');
      loadItemDetails();
    } catch (err) {
      console.error("Ошибка инициализации:", err);
    }
  }

  async function loadItemDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('id');
    const container = document.getElementById('item-container');

    if (!itemId) {
      container.innerHTML = `<div style="text-align: center; color: var(--text-gray);">Лот не найден</div>`;
      return;
    }

    const { data: item, error } = await supabaseClient
      .from('items')
      .select('*, profiles(id, username)')
      .eq('id', itemId)
      .single();

    if (error || !item) {
      container.innerHTML = `<div style="text-align: center; color: var(--text-gray);">Лот не найден или был удален</div>`;
      return;
    }

    currentItem = item;

    container.innerHTML = `
      <div class="item-card">
        <div class="item-category">${item.category}</div>
        <div class="item-title">${item.title}</div>
        <div class="item-price-box">★ ${item.price_stars}</div>
        
        <div class="item-desc-title">Описание лота</div>
        <div class="item-desc">${item.description}</div>

        <div class="seller-box">
          <div class="seller-info">
            <div class="seller-avatar">${(item.profiles?.username || 'S')[0].toUpperCase()}</div>
            <div>
              <div class="seller-name">${item.profiles?.username || 'Продавец'}</div>
              <div class="seller-status">Продавец на Coolx Pay</div>
            </div>
          </div>
          <button style="background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 10px; color: #fff; font-size: 0.75rem; cursor: pointer;" onclick="location.href='profile.html?id=${item.profiles?.id}'">Профиль</button>
        </div>

        <button class="buy-btn" id="buy-btn" onclick="startDeal()">КУПИТЬ (БЕЗОПАСНАЯ СДЕЛКА)</button>
      </div>
    `;
  }

  async function startDeal() {
    if (!currentUserId) {
      alert('Для совершения сделки необходимо авторизоваться.');
      window.location.href = 'auth.html';
      return;
    }

    if (currentUserId === currentItem.seller_id) {
      alert('Вы не можете купить собственный лот!');
      return;
    }

    if (!confirm(`Подтверждаете покупку лота "${currentItem.title}" за ★ ${currentItem.price_stars}?`)) {
      return;
    }

    const btn = document.getElementById('buy-btn');
    btn.disabled = true;
    btn.innerText = 'ОТПРАВКА СЧЕТА В БОТА...';

    try {
      // Отправляем запрос на наш серверный эндпоинт
      const result = await apiBuyItem(currentUserId, currentItem.id);

      if (result.success) {
        alert('Чек на оплату Stars успешно отправлен вам в Telegram-бота! Откройте бота для оплаты.');
      } else {
        alert('Ошибка при выставлении счета: ' + (result.error || 'Неизвестная ошибка'));
      }
    } catch (err) {
      console.error('Buy error:', err);
      alert('Ошибка соединения с сервером.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'КУПИТЬ (БЕЗОПАСНАЯ СДЕЛКА)';
    }
  }

  document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
