<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coolx Pay — Финансы</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #05070a;
      --card-bg: rgba(15, 20, 31, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-pink: #FF0080;
      --accent-cyan: #00DFD8;
      --star-color: #FFB800;
      --grad-coolx: linear-gradient(135deg, #7928CA 0%, #FF0080 100%);
      --text-white: #FFFFFF;
      --text-gray: #94A3B8;
      --font-brand: 'Unbounded', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: var(--bg-main); color: var(--text-white); min-height: 100vh; padding-bottom: 90px; }

    .header { background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--card-border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo { font-family: var(--font-brand); font-size: 1.1rem; font-weight: 900; background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .main-container { max-width: 650px; margin: 0 auto; padding: 20px 16px; }

    .wallet-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px;
    }

    .wallet-val { font-family: var(--font-brand); font-size: 1.8rem; color: var(--star-color); margin: 8px 0 16px 0; }

    .form-box {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 18px; margin-bottom: 24px;
    }

    .form-title { font-family: var(--font-brand); font-size: 0.9rem; margin-bottom: 12px; }
    .input-field { width: 100%; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; color: #fff; font-size: 0.9rem; outline: none; margin-bottom: 12px; }
    .submit-btn { width: 100%; background: var(--grad-coolx); border: none; padding: 14px; border-radius: 12px; color: #fff; font-family: var(--font-brand); font-size: 0.8rem; cursor: pointer; }

    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .history-type { font-size: 0.85rem; font-weight: 600; }
    .history-date { font-size: 0.7rem; color: var(--text-gray); }
    .history-val { font-family: var(--font-brand); font-size: 0.85rem; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; padding: 12px 0 16px 0; z-index: 1000;
    }

    .nav-link { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
    .nav-link.active { color: var(--text-white); }
    .nav-link.active .nav-icon { background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo" onclick="location.href='index.html'">COOLX PAY</div>
    <div style="font-family: var(--font-brand); font-size: 0.8rem; color: var(--accent-cyan);">ФИНАНСЫ</div>
  </header>

  <main class="main-container">
    <div class="wallet-card">
      <div style="font-size: 0.8rem; color: var(--text-gray);">Доступно к выводу</div>
      <div class="wallet-val" id="my-stars-balance">★ 0</div>
    </div>

    <div class="form-box">
      <div class="form-title">Заявка на вывод Stars</div>
      <input type="number" id="payout-amount" class="input-field" placeholder="Количество Stars (мин. 50)">
      <input type="text" id="payout-target" class="input-field" placeholder="Telegram реквизиты (@username / реквизит)">
      <button class="submit-btn" onclick="requestPayout()">ЗАПРОСИТЬ ВЫПЛАТУ</button>
    </div>

    <div class="form-title" style="margin-bottom: 12px;">История транзакций</div>
    <div class="history-list" id="history-box">
      <div style="text-align: center; color: var(--text-gray); font-size: 0.85rem;">Загрузка истории...</div>
    </div>
  </main>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link"><span class="nav-icon">⚡</span><span>Главная</span></a>
    <a href="catalog.html" class="nav-link"><span class="nav-icon">🛍️</span><span>Лоты</span></a>
    <a href="chat.html" class="nav-link"><span class="nav-icon">💬</span><span>Чаты</span></a>
    <a href="finances.html" class="nav-link active"><span class="nav-icon">💎</span><span>Финансы</span></a>
    <a href="profile.html" class="nav-link"><span class="nav-icon">👤</span><span>Профиль</span></a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;

    async function initFinances() {
      const { data: { user } } = await supabase.auth.getUser();
      currentUserId = user?.id || 'demo_user';

      // Загрузка баланса
      const { data: profile } = await supabase.from('profiles').select('balance_stars').eq('id', currentUserId).single();
      if (profile) {
        document.getElementById('my-stars-balance').innerText = `★ ${profile.balance_stars || 0}`;
      }

      // Загрузка истории транзакций
      const { data: transactions } = await supabase.from('transactions').select('*').eq('user_id', currentUserId).order('created_at', { ascending: false });
      const container = document.getElementById('history-box');

      if (!transactions || transactions.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-gray); font-size: 0.85rem;">История транзакций пуста</div>`;
        return;
      }

      container.innerHTML = transactions.map(t => `
        <div class="history-item">
          <div>
            <div class="history-type">${t.type_title}</div>
            <div class="history-date">${new Date(t.created_at).toLocaleDateString()}</div>
          </div>
          <div class="history-val" style="color: ${t.amount > 0 ? '#10B981' : '#EF4444'};">
            ${t.amount > 0 ? '+' : ''}${t.amount} ★
          </div>
        </div>
      `).join('');
    }

    async function requestPayout() {
      const amount = parseInt(document.getElementById('payout-amount').value);
      const target = document.getElementById('payout-target').value.trim();

      if (!amount || amount < 50 || !target) {
        alert('Заполните корректно сумму (мин. 50 Stars) и реквизиты.');
        return;
      }

      const { error } = await supabase.from('payout_requests').insert({
        user_id: currentUserId,
        amount_stars: amount,
        target_details: target,
        status: 'pending'
      });

      if (!error) {
        alert('Заявка на вывод успешно отправлена!');
        location.reload();
      } else {
        alert('Ошибка при создании заявки');
      }
    }

    initFinances();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Защищенная подгрузка Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js" onerror="window.Telegram = { WebApp: { ready: ()=>{}, expand: ()=>{} } };"></script>

  <!-- Подключаем чистые имена JS без дефисов -->
  <script src="/js/apiclient.js"></script>
  <script src="/js/tgapp.js"></script>
  <script src="/js/profilelogic.js"></script>
  <script src="/js/cataloglogic.js"></script>
</body>
</html>
