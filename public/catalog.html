<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coolx Pay — Каталог лотов</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #05070a;
      --card-bg: rgba(15, 20, 31, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(121, 40, 202, 0.5);
      --accent-pink: #FF0080;
      --accent-cyan: #00DFD8;
      --star-color: #FFB800;
      --grad-coolx: linear-gradient(135deg, #7928CA 0%, #FF0080 100%);
      --text-white: #FFFFFF;
      --text-gray: #94A3B8;
      --font-brand: 'Unbounded', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 85px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(121, 40, 202, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .header {
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: var(--font-brand);
      font-size: 1.1rem;
      font-weight: 900;
      background: var(--grad-coolx);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      cursor: pointer;
    }

    .main-container { max-width: 650px; margin: 0 auto; padding: 20px 16px; }

    .search-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .search-box:focus { border-color: var(--card-border-glow); }

    .goods-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

    .coolx-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .coolx-card:hover, .coolx-card:active {
      border-color: var(--card-border-glow);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(121, 40, 202, 0.3);
    }

    .card-category { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: var(--accent-pink); margin-bottom: 6px; }
    .card-title { font-weight: 600; font-size: 0.92rem; line-height: 1.35; margin-bottom: 12px; }
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 10px; }
    .card-price { font-family: var(--font-brand); font-size: 0.85rem; color: var(--star-color); }
    .card-seller { font-size: 0.72rem; color: var(--text-gray); }

    .empty-state { text-align: center; color: var(--text-gray); padding: 40px 0; font-size: 0.9rem; grid-column: span 2; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; padding: 12px 0 16px 0; z-index: 1000;
    }

    .nav-link { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
    .nav-link.active { color: var(--text-white); }
    .nav-link.active .nav-icon { background: var(--grad-coolx); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo" onclick="location.href='index.html'">COOLX PAY</div>
    <div style="font-family: var(--font-brand); font-size: 0.85rem; color: var(--accent-cyan);">КАТАЛОГ</div>
  </header>

  <main class="main-container">
    <input type="text" id="search-input" class="search-box" placeholder="Поиск по названию или категории..." oninput="filterItems()">

    <div class="goods-grid" id="catalog-list">
      <div class="empty-state">Загрузка товаров...</div>
    </div>
  </main>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link"><span class="nav-icon">⚡</span><span>Главная</span></a>
    <a href="catalog.html" class="nav-link active"><span class="nav-icon">🛍️</span><span>Лоты</span></a>
    <a href="chat.html" class="nav-link"><span class="nav-icon">💬</span><span>Чаты</span></a>
    <a href="finances.html" class="nav-link"><span class="nav-icon">💎</span><span>Финансы</span></a>
    <a href="profile.html" class="nav-link"><span class="nav-icon">👤</span><span>Профиль</span></a>
  </nav>

  <script>
    let supabaseClient = null;
    let allItems = [];

    async function initApp() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
          auth: { persistSession: false }
        });

        loadCatalog();
      } catch (err) {
        console.error("Ошибка инициализации Supabase:", err);
      }
    }

    async function loadCatalog() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('items')
        .select('*, profiles(username)')
        .eq('status', 'active');

      const container = document.getElementById('catalog-list');

      if (error || !data || data.length === 0) {
        container.innerHTML = `<div class="empty-state">Товары пока не добавлены</div>`;
        return;
      }

      allItems = data;
      renderItems(allItems);
    }

    function renderItems(items) {
      const container = document.getElementById('catalog-list');
      if (items.length === 0) {
        container.innerHTML = `<div class="empty-state">Ничего не найдено</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="coolx-card" onclick="location.href='item.html?id=${item.id}'">
          <div>
            <div class="card-category">${item.category}</div>
            <div class="card-title">${item.title}</div>
          </div>
          <div class="card-bottom">
            <div class="card-price">★ ${item.price_stars}</div>
            <div class="card-seller">${item.profiles?.username || 'seller'}</div>
          </div>
        </div>
      `).join('');
    }

    function filterItems() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allItems.filter(item => 
        item.title.toLowerCase().includes(query) || 
        item.category.toLowerCase().includes(query)
      );
      renderItems(filtered);
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
  
  <script src="https://telegram.org/js/telegram-web-app.js" onerror="window.Telegram = { WebApp: { ready: ()=>{}, expand: ()=>{} } };"></script>
  <script src="/api/apiclient.js"></script>
  <script src="/api/tgapp.js"></script>
  <script src="/api/profilelogic.js"></script>
  <script src="/api/cataloglogic.js"></script>
</body>
</html>
